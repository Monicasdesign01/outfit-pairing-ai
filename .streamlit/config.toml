# Only long-standing theme keys are used here on purpose. Streamlit
# refuses to start on an unrecognised config option, and this file ships
# to Streamlit Community Cloud - which may run a different Streamlit
# version - so a newer-only key would take the live app down rather than
# just being ignored.
#
# The palette is deliberately restrained: a near-black accent on warm
# off-white, the way clothing retailers present product photography. The
# garments should be the only saturated colour on the page, so the
# interface stays out of their way.
[theme]
base = "light"
primaryColor = "#26241F"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F2EE"
textColor = "#1A1917"
font = "sans serif"

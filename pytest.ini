[pytest]
# The project's modules sit at the repository root, not in a package, so
# the root has to be on sys.path for `from color_detector import ...` to
# resolve. Running `python -m pytest` adds the working directory
# automatically, but a bare `pytest` does not - which is exactly how CI
# ran it, so the suite passed locally and failed on the first CI run with
# ModuleNotFoundError. Setting it here means both ways of running work.
pythonpath = .
testpaths = tests
